# m6 的 nginx 給 anoni.net/gears/ 的設定，寫在 /etc/nginx/conf.d/anoninet.conf。
# 本檔是範本，改了之後要手動同步到那裡，動之前先備份，改完 nginx -t 再 reload。
#
# 標頭（CSP、cross-origin isolation、快取）寫在 /etc/nginx/snippets/gears-headers.conf，
# 由建置產生（vite.config.ts 的 nginxHeaders），m6 的拉取腳本（tools/m6-pull.sh）自動換上。
# 每個 location 都要 include 一次：location 裡有自己的 add_header 時，外層的不會繼承下來。

# ── http 層，放在其他 map 旁邊 ──────────────────────────────────────────────
#
# 頁面與圖片帶 no-transform：Cloudflare 不在頁面注入 Web Analytics 與 JS Detections 的 script
# （CSP 本來就會擋下，只會在主控台留下錯誤），也不用 Polish 重新壓縮圖片。其他檔案不帶：
# 帶了 no-transform 的回應 Cloudflare 完全不壓縮，連這裡送出的 gzip 也會解開再送給讀者
# （2026-10-16 實測 165 清單 1.5 MB、onnxruntime 的 WebAssembly 14 MB 都是原始大小）。
# 頁面、sw.js、manifest 與 165 清單送 no-cache，新版本才進得來。Cloudflare 的 Cache Rule
# 「gears respect origin」讓 /gears/ 的邊緣與瀏覽器都照這裡的值（sw.js 另由「docs sw.js no-cache」
# 整個不快取），no-cache 的頁面每次回來確認，沒變就是 304。assets/ 底下的檔名帶雜湊，可以存很久。
map $uri $gears_cache_control {
    default                                         "public, max-age=3600";
    "/gears/sw.js"                                  "no-cache";
    "~^/gears/(.*/)?$"                              "no-cache, no-transform";
    "~^/gears/.*\.html$"                           "no-cache, no-transform";
    "~^/gears/.*\.(webmanifest|txt)$"              "no-cache";
    "~^/gears/.*\.(png|svg|ico|jpe?g|webp)$"       "public, max-age=3600, no-transform";
    "~^/gears/assets/"                              "public, max-age=31536000, immutable";
}

# ── server anoni.net（clearnet）裡，放在 location /mystery/ 之後 ─────────────

    # 檔案工作台。內容是 anoni-net/gears 的 build 分支，由 GitHub Actions 建置，
    # clone 在 /srv/anoni-net-gears/build，m6 的 cron 每 5 分鐘拉一次（該 repo 的 tools/m6-pull.sh）。
    # 逐字稿的模型不進 build 分支，由同一支腳本下載到 /srv/anoni-net-gears/models/。
    location = /gears {
        return 301 https://$host/gears/$is_args$args;
    }

    location /gears/models/whisper/ {
        alias /srv/anoni-net-gears/models/whisper/;
        include /etc/nginx/snippets/gears-headers.conf;
    }

    location /gears/models/speaker/ {
        alias /srv/anoni-net-gears/models/speaker/;
        include /etc/nginx/snippets/gears-headers.conf;
    }

    # pdf.js 的 .mjs 要用 JavaScript 的 MIME 送出，瀏覽器才肯當成模組載入。
    # mime.types 沒有 mjs，在 location 裡寫 types 會蓋掉整份對照，所以另開一個 location
    location ~ ^/gears/(.+\.mjs)$ {
        alias /srv/anoni-net-gears/build/site/$1;
        types { }
        default_type text/javascript;
        include /etc/nginx/snippets/gears-headers.conf;
    }

    location /gears/ {
        alias /srv/anoni-net-gears/build/site/;
        index index.html;
        error_page 403 =404 /404.html;
        include /etc/nginx/snippets/gears-headers.conf;
        # onnxruntime 的 WebAssembly 壓縮後約小四分之三
        gzip_types text/plain text/css text/javascript application/javascript application/json
                   application/manifest+json application/wasm image/svg+xml;
    }

# ── onion 版 ────────────────────────────────────────────────────────────────
#
# gears.<onion>，網站放在子網域的根目錄，內容是 build 分支的 onion/（GEARS_TARGET=onion 的建置）。
# 標頭寫在 /etc/nginx/snippets/gears-onion-headers.conf，同樣由建置產生、拉取腳本換上。
# 拉取腳本要先換上那份標頭，下面的 server block 才通過得了 nginx -t。
#
# 不經過 Cloudflare，不必為了 Cloudflare 加 no-transform。快取的對照跟 clearnet 相同，只是路徑
# 少了 /gears。

# http 層，放在 map $gears_cache_control 旁邊
map $uri $gears_onion_cache_control {
    default                                 "public, max-age=3600";
    "/sw.js"                                "no-cache";
    "~^/(.*/)?$"                            "no-cache";
    "~\.html$"                              "no-cache";
    "~\.(webmanifest|txt)$"                 "no-cache";
    "~^/assets/"                            "public, max-age=31536000, immutable";
}

# server 層，放在其他 onion 子網域的 server block 旁邊
server {
    listen unix:/var/run/tor-sitepad-anoni.sock;
    server_name gears.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion;

    charset utf-8;
    root /srv/anoni-net-gears/build/onion/;
    index index.html;
    error_page 403 =404 /404.html;

    location / {
        include /etc/nginx/snippets/gears-onion-headers.conf;
    }

    location /models/whisper/ {
        alias /srv/anoni-net-gears/models/whisper/;
        include /etc/nginx/snippets/gears-onion-headers.conf;
    }

    location /models/speaker/ {
        alias /srv/anoni-net-gears/models/speaker/;
        include /etc/nginx/snippets/gears-onion-headers.conf;
    }

    # 社群轉檔的模型。clearnet 版從 assets.anoni.net 下載，onion 版讀同一份檔案，不經過 clearnet
    location /models/assets/ {
        alias /srv/images-anoni-net/gears/models/;
        include /etc/nginx/snippets/gears-onion-headers.conf;
    }

    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        include /etc/nginx/snippets/gears-onion-headers.conf;
    }

    gzip_comp_level 9;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml;

    access_log /var/log/nginx/access_anoni-net-gears_onion.log main;
    error_log /var/log/nginx/error_anoni-net-gears_onion.log;
}
