# m6 的 nginx 給 anoni.net/gears/ 的設定，寫在 /etc/nginx/conf.d/anoninet.conf。
# 本檔是範本，改了之後要手動同步到那裡，動之前先備份，改完 nginx -t 再 reload。
#
# 標頭（CSP、cross-origin isolation、快取）寫在 /etc/nginx/snippets/gears-headers.conf，
# 由建置產生（vite.config.ts 的 nginxHeaders），m6 的拉取腳本（tools/m6-pull.sh）自動換上。
# 每個 location 都要 include 一次：location 裡有自己的 add_header 時，外層的不會繼承下來。

# ── http 層，放在其他 map 旁邊 ──────────────────────────────────────────────
#
# 全部帶 no-transform：Cloudflare 不在頁面注入 Web Analytics 與 JS Detections 的 script
# （CSP 本來就會擋下，只會在主控台留下錯誤），也不改動任何檔案。代價是 Cloudflare 不壓縮，
# 由這裡 gzip。
# 頁面、sw.js、manifest 與 165 清單送 no-cache，新版本才進得來。Cloudflare 的 Cache Rule
# 「gears respect origin」讓 /gears/ 的邊緣與瀏覽器都照這裡的值（sw.js 另由「docs sw.js no-cache」
# 整個不快取），no-cache 的頁面每次回來確認，沒變就是 304。assets/ 底下的檔名帶雜湊，可以存很久。
map $uri $gears_cache_control {
    default                                         "public, max-age=3600, no-transform";
    "/gears/sw.js"                                  "no-cache, no-transform";
    "~^/gears/assets/"                              "public, max-age=31536000, immutable, no-transform";
    "~^/gears/(.*/)?$"                              "no-cache, no-transform";
    "~^/gears/.*\.(html|webmanifest|txt)$"          "no-cache, no-transform";
}

# ── server anoni.net（clearnet）裡，放在 location /mystery/ 之後 ─────────────

    # 檔案工作台。內容是 anoni-net/gears 的 build 分支，由 GitHub Actions 建置，
    # clone 在 /srv/anoni-net-gears/build，m6 的 cron 每 5 分鐘拉一次（該 repo 的 tools/m6-pull.sh）。
    # 逐字稿的模型不進 build 分支，由同一支腳本下載到 /srv/anoni-net-gears/models/。
    location = /gears {
        return 301 https://$host/gears/$is_args$args;
    }

    location /gears/models/whisper/ {
        alias /srv/anoni-net-gears/models/whisper/;
        include /etc/nginx/snippets/gears-headers.conf;
    }

    location /gears/models/speaker/ {
        alias /srv/anoni-net-gears/models/speaker/;
        include /etc/nginx/snippets/gears-headers.conf;
    }

    # pdf.js 的 .mjs 要用 JavaScript 的 MIME 送出，瀏覽器才肯當成模組載入。
    # mime.types 沒有 mjs，在 location 裡寫 types 會蓋掉整份對照，所以另開一個 location
    location ~ ^/gears/(.+\.mjs)$ {
        alias /srv/anoni-net-gears/build/site/$1;
        types { }
        default_type text/javascript;
        include /etc/nginx/snippets/gears-headers.conf;
    }

    location /gears/ {
        alias /srv/anoni-net-gears/build/site/;
        index index.html;
        error_page 403 =404 /404.html;
        include /etc/nginx/snippets/gears-headers.conf;
        # onnxruntime 的 WebAssembly 壓縮後約小四分之三
        gzip_types text/plain text/css text/javascript application/javascript application/json
                   application/manifest+json application/wasm image/svg+xml;
    }
