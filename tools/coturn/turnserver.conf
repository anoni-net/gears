# 遠端傳送自架的 TURN（anoni-net/gears#104，AGENTS.md 的「遠端傳送的轉送服務」）。
# 複製到 VPS 的 /srv/gears-turn/turnserver.conf，<…> 換成實際的值，用 tools/coturn/compose.yml 執行。
#
# 只當中繼：兩端的瀏覽器都設 iceTransportPolicy: "relay"，雙方看到的對方位址都是這台的中繼位址，
# 所以只允許轉送到這台自己的公開 IP，中繼不能拿來連網際網路上的其他主機或內部網路，有人改了前端
# 不走 relay 時連線會失敗。2026-10-21 在 m6 的 Tailscale 位址上驗證過這條規則可以運作。

listening-port=3478
# TURNS：限制比較多的網路只放行 443。這台沒有其他服務用 443 時直接聽 443
tls-listening-port=443
realm=<TURN 子網域>
server-name=<TURN 子網域>
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# 中繼用的 port，範圍照同時連線數調整，防火牆一起開
min-port=49160
max-port=49200

# 短效帳密由轉送服務簽發（server/turn.ts 的 coturnIce），密鑰跟 m6 的 relay.env 的 TURN_SECRET 相同
use-auth-secret
static-auth-secret=<只放在伺服器上的密鑰>

# 只轉發到自己的中繼位址
no-multicast-peers
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=<這台的公開 IPv4>

# 流量與連線數。max-bps 是每個 session 每秒的位元組
user-quota=4
total-quota=100
max-bps=12500000
stale-nonce=600

fingerprint
no-software-attribute
# 不記錄連線的 IP
no-stdout-log
log-file=/dev/null
