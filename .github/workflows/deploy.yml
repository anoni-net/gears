name: deploy

# main 的 CI 通過之後建置，推到 build 分支，m6 每 5 分鐘拉一次（tools/m6-pull.sh）。
# build 分支保留歷史，出問題時可以退回上一個 commit。
#
# - site/：網站本身，nginx 的 /gears/ 讀這裡
# - onion/：onion 版（GEARS_TARGET=onion），網站放在 gears.<onion> 的根目錄
# - server/relay.mjs：遠端傳送的轉送服務（vite.server.config.ts），m6 在容器裡執行（tools/relay-compose.yml）
# - deploy/models.txt：逐字稿的模型清單。Whisper small 的單一檔案超過 GitHub 的 100 MB，
#   模型不進 build 分支，由 m6 照清單下載
# - deploy/nginx-headers.conf、nginx-headers-onion.conf：nginx 送的 CSP 與其他標頭，m6 比對有變才換上
#
# 每週重建一次，更新 165 反詐騙清單（每月更新）。清單只有下載日期不同時沿用上一份，
# 不必讓讀者為此換一次版本。下載失敗時也沿用上一份。
# 產物沒變時不推，m6 那一側也就沒有東西要拉。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

# onnxruntime-node（Transformers.js 帶進來的相依套件）的安裝腳本會從 nuget.org 另外下載 Linux 的
# CUDA 檔案，GitHub 的機器連不上時 npm ci 整個失敗（2026-11-20 兩次）。網頁只用 onnxruntime-web，
# Node 裡的單元測試用的 CPU 版已經包在 npm 套件裡，用不到 CUDA，所以略過
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # 好幾個 PR 接連合併時，每一個的 CI 都會觸發一次部署，CI 跑完的順序不一定照合併的順序。
  # 2026-11-21 合併 #190、#186、#188、#189，#188 的 CI 最晚跑完，它的部署把 #189 的版本蓋回 #188。
  # CI 觸發的部署只建置 main 最新的那一筆，比較舊的略過，最新那一筆的 CI 通過時自己會觸發部署。
  # 排程與手動觸發本來就是 main 最新的一筆
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$SHA" ]; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::main 已經是 ${head:0:8}，${SHA:0:8} 不部署，等最新那一筆的 CI"
            echo "ok=false" >>"$GITHUB_OUTPUT"
          fi

  deploy:
    needs: latest
    # workflow_run 的 branches 比對的是來源分支的名稱，fork 從自己的 main 開 PR 也符合，
    # 所以另外限定：這個 repo 自己的 push 觸發的 CI 才部署，PR 的 CI 一律不部署
    if: >-
      needs.latest.outputs.ok == 'true' && (
        github.event_name != 'workflow_run' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # sherpa-onnx 的 WebAssembly（約 14 MB）與遮蔽的文字辨識模型（約 21 MB）跟著網站部署，依清單快取
      - uses: actions/cache@v6.1.0
        with:
          path: |
            public/vendor/sherpa
            public/models/ppocr
          key: sherpa-ppocr-${{ hashFiles('src/tools/transcribe/sherpa-runtime.json', 'src/tools/redact/ppocr-models.json') }}
      - run: node scripts/fetch-whisper.mjs sherpa ppocr

      - name: 165 反詐騙清單
        run: |
          git fetch -q --depth=1 origin build:build 2>/dev/null || true
          prev=$(mktemp)
          git show build:site/data/165.txt >"$prev" 2>/dev/null || : >"$prev"
          strip() { sed 's/ fetched=[0-9-]*//' "$1"; }
          if node scripts/fetch-165.mjs; then
            if [ -s "$prev" ] && [ "$(strip public/data/165.txt)" = "$(strip "$prev")" ]; then
              cp "$prev" public/data/165.txt
            fi
          elif [ -s "$prev" ]; then
            # 目錄由下載腳本建立，下載失敗時還不存在
            echo "::warning::165 清單下載失敗，沿用上一份"
            mkdir -p public/data
            cp "$prev" public/data/165.txt
          else
            echo "::warning::165 清單下載失敗，這一版沒有清單"
          fi

      # sitemap 的 lastmod 跟上一版比對每一頁內容的雜湊（vite.config.ts 的 sitemap()），
      # 上一版從 build 分支取出，build 分支在上一步已經抓下來。取不到時建置不寫 lastmod
      - name: 上一版的 sitemap 狀態
        run: |
          for dir in site onion; do
            git show "build:$dir/sitemap-state.json" >"$RUNNER_TEMP/sitemap-$dir.json" 2>/dev/null \
              || rm -f "$RUNNER_TEMP/sitemap-$dir.json"
          done
      - run: GEARS_SITEMAP_STATE="$RUNNER_TEMP/sitemap-site.json" npm run build
      - run: GEARS_TARGET=onion GEARS_SITEMAP_STATE="$RUNNER_TEMP/sitemap-onion.json" npm run build
      - run: npm run build:server && node scripts/check-relay.mjs
      - run: node scripts/fetch-whisper.mjs --manifest deploy/models.txt

      # assets/ 的檔名帶雜湊。上一版的檔案多留一輪：已經開著舊頁面的讀者，之後才載入的
      # 工具還會要舊的檔案，刪掉的話會拿到 404
      #
      # rsync 用 --checksum 比對內容。預設只比大小與修改時間，頁面與 sw.js 常常只換了
      # 雜湊、大小不變，建置與 checkout 又落在同一秒，2026-10-17 就因此沒有複製新的頁面，
      # 新的程式跟舊的頁面參照到不同的檔案。推送前再用 check-site.mjs 確認參照到的檔案都在
      - name: 推到 build 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify build >/dev/null; then
            git worktree add ../out build
          else
            git worktree add --orphan -b build ../out
          fi
          mkdir -p ../out/deploy
          # $1 建置的目錄、$2 build 分支裡的目錄、$3 記錄這一輪 assets/ 的清單
          publish() {
            mkdir -p "$2/assets"
            keep=$(mktemp)
            { ls "$1/assets"; cat "../out/deploy/$3" 2>/dev/null || true; } | sort -u >"$keep"
            rsync -a --checksum --delete --exclude assets/ "$1/" "$2/"
            rsync -a --checksum "$1/assets/" "$2/assets/"
            for f in "$2"/assets/*; do
              grep -qxF "$(basename "$f")" "$keep" || rm "$f"
            done
            ls "$1/assets" >"../out/deploy/$3"
          }
          publish dist ../out/site assets.txt
          publish dist-onion ../out/onion assets-onion.txt
          mkdir -p ../out/server
          cp dist-server/relay.mjs ../out/server/relay.mjs
          cp deploy/models.txt deploy/nginx-headers.conf deploy/nginx-headers-onion.conf ../out/deploy/
          node scripts/check-site.mjs ../out/site
          node scripts/check-site.mjs ../out/onion / --onion
          cd ../out
          git add -A
          if git diff --cached --quiet; then
            echo "產物沒有變動"
            exit 0
          fi
          git commit -q -m "build: ${{ github.event.workflow_run.head_sha || github.sha }} (${{ github.event_name }})"
          git push origin build
