name: deploy

# main 的 CI 通過之後建置，推到 build 分支，m6 每 5 分鐘拉一次（tools/m6-pull.sh）。
# build 分支保留歷史，出問題時可以退回上一個 commit。
#
# - site/：網站本身，nginx 的 /gears/ 讀這裡
# - onion/：onion 版（GEARS_TARGET=onion），網站放在 gears.<onion> 的根目錄
# - server/relay.mjs：遠端傳送的轉送服務（vite.server.config.ts），m6 在容器裡執行（tools/relay-compose.yml）
# - deploy/models.txt：逐字稿的模型清單。Whisper small 的單一檔案超過 GitHub 的 100 MB，
#   模型不進 build 分支，由 m6 照清單下載
# - deploy/nginx-headers.conf、nginx-headers-onion.conf：nginx 送的 CSP 與其他標頭，m6 比對有變才換上
#
# 每週重建一次，更新 165 反詐騙清單（每月更新）。清單只有下載日期不同時沿用上一份，
# 不必讓讀者為此換一次版本。下載失敗時也沿用上一份。
# 產物沒變時不推，m6 那一側也就沒有東西要拉。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # sherpa-onnx 的 WebAssembly（約 14 MB）跟著網站部署，依清單快取
      - uses: actions/cache@v6.1.0
        with:
          path: public/vendor/sherpa
          key: sherpa-${{ hashFiles('src/tools/transcribe/sherpa-runtime.json') }}
      - run: node scripts/fetch-whisper.mjs sherpa

      - name: 165 反詐騙清單
        run: |
          git fetch -q --depth=1 origin build:build 2>/dev/null || true
          prev=$(mktemp)
          git show build:site/data/165.txt >"$prev" 2>/dev/null || : >"$prev"
          strip() { sed 's/ fetched=[0-9-]*//' "$1"; }
          if node scripts/fetch-165.mjs; then
            if [ -s "$prev" ] && [ "$(strip public/data/165.txt)" = "$(strip "$prev")" ]; then
              cp "$prev" public/data/165.txt
            fi
          elif [ -s "$prev" ]; then
            # 目錄由下載腳本建立，下載失敗時還不存在
            echo "::warning::165 清單下載失敗，沿用上一份"
            mkdir -p public/data
            cp "$prev" public/data/165.txt
          else
            echo "::warning::165 清單下載失敗，這一版沒有清單"
          fi

      - run: npm run build
      - run: GEARS_TARGET=onion npm run build
      - run: npm run build:server && node scripts/check-relay.mjs
      - run: node scripts/fetch-whisper.mjs --manifest deploy/models.txt

      # assets/ 的檔名帶雜湊。上一版的檔案多留一輪：已經開著舊頁面的讀者，之後才載入的
      # 工具還會要舊的檔案，刪掉的話會拿到 404
      #
      # rsync 用 --checksum 比對內容。預設只比大小與修改時間，頁面與 sw.js 常常只換了
      # 雜湊、大小不變，建置與 checkout 又落在同一秒，2026-10-17 就因此沒有複製新的頁面，
      # 新的程式跟舊的頁面參照到不同的檔案。推送前再用 check-site.mjs 確認參照到的檔案都在
      - name: 推到 build 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify build >/dev/null; then
            git worktree add ../out build
          else
            git worktree add --orphan -b build ../out
          fi
          mkdir -p ../out/deploy
          # $1 建置的目錄、$2 build 分支裡的目錄、$3 記錄這一輪 assets/ 的清單
          publish() {
            mkdir -p "$2/assets"
            keep=$(mktemp)
            { ls "$1/assets"; cat "../out/deploy/$3" 2>/dev/null || true; } | sort -u >"$keep"
            rsync -a --checksum --delete --exclude assets/ "$1/" "$2/"
            rsync -a --checksum "$1/assets/" "$2/assets/"
            for f in "$2"/assets/*; do
              grep -qxF "$(basename "$f")" "$keep" || rm "$f"
            done
            ls "$1/assets" >"../out/deploy/$3"
          }
          publish dist ../out/site assets.txt
          publish dist-onion ../out/onion assets-onion.txt
          mkdir -p ../out/server
          cp dist-server/relay.mjs ../out/server/relay.mjs
          cp deploy/models.txt deploy/nginx-headers.conf deploy/nginx-headers-onion.conf ../out/deploy/
          node scripts/check-site.mjs ../out/site
          node scripts/check-site.mjs ../out/onion / --onion
          cd ../out
          git add -A
          if git diff --cached --quiet; then
            echo "產物沒有變動"
            exit 0
          fi
          git commit -q -m "build: ${{ github.event.workflow_run.head_sha || github.sha }} (${{ github.event_name }})"
          git push origin build
