name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# onnxruntime-node（Transformers.js 帶進來的相依套件）的安裝腳本會從 nuget.org 另外下載 Linux 的
# CUDA 檔案，GitHub 的機器連不上時 npm ci 整個失敗（2026-11-20 兩次）。網頁只用 onnxruntime-web，
# Node 裡的單元測試用的 CPU 版已經包在 npm 套件裡，用不到 CUDA，所以略過
env:
  ONNXRUNTIME_NODE_INSTALL: skip

# 同一個 PR 推了新的 commit，前一次還在執行的就取消。main 的每一筆自成一組，互不等待也不取消：
# 同一組裡只能一個在執行、一個在等，接連合併時後面的要排隊，中間的還會被取消
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 瀏覽器測試依瀏覽器拆開，每個瀏覽器再用 Playwright 的 --shard 分成幾片，各自一台機器同時執行。
  # 公開 repo 的 GitHub 機器是 4 核心、16 GB，Playwright 開 2 個 worker，原本一個瀏覽器一台時
  # 測試本身要 5 到 10 分鐘，iPhone 最慢。分片照測試的數量切，不照時間，逐字稿的測試排在後面，
  # 所以 iPhone 切三片。2026-11-25 用一次 CI 的每項時間估算，最慢的一片連同安裝約 5 到 6 分鐘，
  # 原本最慢的一台是 8 到 11 分鐘。
  # 單元測試、型別檢查、轉送服務與 onion 版只做一次，放在 Chromium 的第一片。單元測試另外執行一次
  # playwright，跟 Chromium 一起分片的話，第一片會分到全部的單元測試（數量多但很快），兩片很不平均。
  # 每一片都通過，這個 workflow 才算通過，deploy.yml 等的就是它。
  # Free 方案的 organization 同時最多 20 個 job，這裡一次是 9 個，PR 與 main 的 CI 重疊時仍在上限以內
  test:
    name: test (${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # 每片的測試估計 2 到 5 分鐘，但 GitHub 機器的 apt 有時很慢，安裝 ffmpeg 與瀏覽器的相依套件
    # 就花掉 10 分鐘以上（2026-11-19 連續好幾次），上限留寬
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium, project: chromium, browser: chromium, shard: 1, total: 2 }
          - { name: chromium, project: chromium, browser: chromium, shard: 2, total: 2 }
          - { name: firefox, project: firefox, browser: firefox, shard: 1, total: 2 }
          - { name: firefox, project: firefox, browser: firefox, shard: 2, total: 2 }
          - { name: webkit, project: webkit, browser: webkit, shard: 1, total: 2 }
          - { name: webkit, project: webkit, browser: webkit, shard: 2, total: 2 }
          - { name: iphone, project: iphone, browser: webkit, shard: 1, total: 3 }
          - { name: iphone, project: iphone, browser: webkit, shard: 2, total: 3 }
          - { name: iphone, project: iphone, browser: webkit, shard: 3, total: 3 }
    env:
      # 只做一次的步驟放在 Chromium 的第一片
      FIRST: ${{ matrix.name == 'chromium' && matrix.shard == 1 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 瀏覽器測試用 pillow-heif 產生真的 HEIC（tests/global-setup.ts）
      - uses: astral-sh/setup-uv@v10.3.0
      - if: env.FIRST == 'true'
        run: npm run typecheck
      # 遠端傳送的轉送服務打包成單一個檔案，確認跑得起來（開房、配對、轉送）
      - if: env.FIRST == 'true'
        run: npm run build:server && node scripts/check-relay.mjs
      # 逐字稿的瀏覽器測試要 Whisper base、分辨說話者的 CAM++ 與 sherpa-onnx 的 WebAssembly（約 80、28、14 MB），
      # 遮蔽的自動尋找要 PP-OCR（約 26 MB），逐字稿的語音偵測要 Silero VAD（約 1.2 MB），都不進 repo，依清單快取
      - uses: actions/cache@v6.1.0
        with:
          path: |
            public/models/whisper
            public/models/speaker
            public/models/ppocr
            public/models/vad
            public/vendor/sherpa
          key: whisper-base-speaker-sherpa-ppocr-vad-${{ hashFiles('src/tools/transcribe/models.json', 'src/tools/transcribe/speaker-model.json', 'src/tools/transcribe/sherpa-runtime.json', 'src/tools/redact/ppocr-models.json', 'src/tools/transcribe/vad-model.json') }}
      - run: node scripts/fetch-whisper.mjs base speaker sherpa ppocr vad --no-webgpu
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # 影片的關鍵影格的測試影片（H.264 MP4、VP8 WebM）由 tests/global-setup.ts 用 ffmpeg 產生，
      # GitHub 的 ubuntu 機器沒有預裝
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
      - if: env.FIRST == 'true'
        run: npx playwright test --project=unit
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }}
      # onion 版（GEARS_TARGET=onion）建得起來、沒有連到 clearnet，網站放在根目錄也打得開
      - if: env.FIRST == 'true'
        run: npm run test:onion
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.name }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
