name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 瀏覽器測試用 pillow-heif 產生真的 HEIC（tests/global-setup.ts）
      - uses: astral-sh/setup-uv@v10.3.0
      - run: npm run typecheck
      # 逐字稿的瀏覽器測試要 Whisper base 模型（約 80 MB，不進 repo），依模型清單快取
      - uses: actions/cache@v6.1.0
        with:
          path: public/models/whisper
          key: whisper-base-${{ hashFiles('src/tools/transcribe/models.json') }}
      - run: node scripts/fetch-whisper.mjs base
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
